appId: app.splitlane.window
productName: SplitLane
directories:
  output: release
  buildResources: build
files:
  - out/**
# the six files of the helper next to the window, in <ProductDir>\helper (spec 2 of stage 2)
extraFiles:
  - from: ../dist/helper
    to: helper
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # the wizard in English and Russian (spec 4 of stage 2 part 3), no language selector: NSIS takes the Windows
  # display language (GetUserDefaultUILanguage) when it matches a language here, then its primary language
  # (any ru-*), else the language whose table the script makes first. That is English: messages.nsh of
  # electron-builder, in the header of the script, gives every string in English first (installer.nsh makes
  # no table: its strings are in customHeader), and en_US leads this list, which loads the languages. The
  # uninstaller picks the same way at its start; nothing stores the language. The version information of
  # the .exe is English (language unset: 1033).
  installerLanguages:
    - en_US
    - ru_RU
  multiLanguageInstaller: true
  displayLanguageSelector: false
  include: build/installer.nsh
  artifactName: SplitLane-Setup-${version}.${ext}
  uninstallDisplayName: SplitLane
# the window cannot be started as Node.js with code of one's own (spec 5 of stage 2)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
