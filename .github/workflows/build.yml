# SplitLane: build and check on GitHub Actions (spec 6 and 7 of stage 2). The job build gets the core with
# its SHA-256 checked, runs go vet and go test of the helper, builds the installer with
# scripts\build-installer.ps1 (helper, typecheck, tests and build of the window, electron-builder), installs
# and uninstalls it on the runner with scripts\test-installer.ps1 and uploads the installer and its .sha256.
# On a tag v<version> (it must be the version of app/package.json, else the build fails) the job release
# makes a draft release with those two files. Nothing is signed (part 5 adds signing).
# Every action is pinned by the full SHA of its commit; the comment names the version.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          $version = (Get-Content -LiteralPath app\package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::version in app/package.json is not x.y.z: $version"
            exit 1
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Host "::error::the tag $env:GITHUB_REF_NAME is not v$version, the version in app/package.json"
            exit 1
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.9.1'
          package_json_file: app/package.json

      - name: Core
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\fetch-core.ps1

      - name: go vet
        working-directory: helper
        run: go vet ./...

      - name: go test
        working-directory: helper
        run: go test ./...

      - name: Build the installer
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sum = (Get-Content -LiteralPath "app\release\SplitLane-Setup-$env:VERSION.exe.sha256" -Raw).Trim()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('SHA-256: `' + $sum + '`')

      - name: Test the installer
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'test-installer'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-installer.ps1 -Installer "app\release\SplitLane-Setup-$env:VERSION.exe" -LogDir $logs | Tee-Object -Variable lines
          $code = $LASTEXITCODE
          $last = @($lines | Where-Object { "$_".Trim() }) | Select-Object -Last 1
          if (-not $last) { $last = "no output, exit code $code" }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Installer check: `' + $last + '`')
          exit $code

      # The private repository has 500 MB of artifact storage and the installer is about 160 MB: the artifact
      # is kept 2 days and not made for a pull request (its push makes one). A tag's release job takes it from
      # this run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: SplitLane-Setup-${{ steps.version.outputs.version }}
          path: |
            app/release/SplitLane-Setup-${{ steps.version.outputs.version }}.exe
            app/release/SplitLane-Setup-${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      # After a failure: what scripts\test-installer.ps1 -LogDir collected (the output of the helper's diagnostic
      # runs) and the logs of %ProgramData%\SplitLane\logs (with .prev); nothing when there is none of them.
      - name: Collect the failure logs
        if: failure()
        run: |
          $logs = Join-Path $env:ProgramData 'SplitLane\logs'
          if (Test-Path -LiteralPath $logs) {
            $to = Join-Path $env:RUNNER_TEMP 'test-installer\logs'
            New-Item -ItemType Directory -Force -Path $to | Out-Null
            Copy-Item -Path (Join-Path $logs '*.log*') -Destination $to -Force
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-installer-logs
          path: ${{ runner.temp }}/test-installer/
          if-no-files-found: ignore
          retention-days: 2

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SplitLane-Setup-${{ needs.build.outputs.version }}
          path: release

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "SplitLane $VERSION"
          "release/SplitLane-Setup-$VERSION.exe" "release/SplitLane-Setup-$VERSION.exe.sha256"
