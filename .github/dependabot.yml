# SplitLane: Dependabot opens pull requests for the Go modules of the service, the npm packages of the window and the
# actions of CI; build.yml checks each one. Minor and patch updates come grouped, a major one alone. What it cannot
# see (the sing-box core and the Go toolchain) is watched by upstream.yml. What to do with them: docs/maintenance.md.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /helper
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps(helper)'

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # the Node types follow the Node inside Electron and of CI (24): a newer major comes together with them
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps(app)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'deps(ci)'
